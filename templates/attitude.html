<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>پرسشنامه نگرش ({{ mode }})</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn-font@latest/dist/font-face.css" rel="stylesheet">
  <style>
    body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f5f6fa;margin:0}
    .wrap{max-width:900px;margin:36px auto;padding:0 16px}
    .card{background:#fff;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:22px}
    h1{margin:0 0 6px;color:#004080;font-size:20px}
    .muted{color:#666;font-size:13px;margin-bottom:14px}
    .q{border:1px solid #e9ecef;border-radius:12px;padding:14px 12px;margin:10px 0;background:#fff}
    .q-title{font-size:14px;line-height:1.9;margin-bottom:10px}
    .opts{display:flex;gap:10px;flex-wrap:wrap}
    label{font-size:13px;color:#333}
    .actions{margin-top:16px}
    .btn{background:#0d6efd;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>پرسشنامه نگرش ({{ mode }})</h1>
      <div class="muted">۱=کاملاً مخالفم … ۵=کاملاً موافقم</div>

      <form method="post">
        {% for it in items %}
          <div class="q">
            <div class="q-title">{{ loop.index }}. {{ it.text }}</div>
            <div class="opts">
              {% for v in [1,2,3,4,5] %}
                <label>
                  <input type="radio" name="item_{{ it.id }}" value="{{ v }}" required>
                  {{ v }}
                </label>
              {% endfor %}
            </div>
          </div>
        {% endfor %}

        <div class="actions">
          <button class="btn" type="submit">ثبت و ادامه</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
