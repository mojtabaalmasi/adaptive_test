<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرسشنامه نگرش (PKRQ)</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }

        h2 {
            color: #1a2980;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 25px;
        }

        .item {
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f8fafc;
        }

        .item-text {
            margin-bottom: 10px;
            font-weight: 500;
            color: #2c3e50;
        }

        .scale {
            display: flex;
            justify-content: space-between;
            max-width: 500px;
        }

        .scale label {
            font-size: 0.9rem;
            cursor: pointer;
        }

        .scale input {
            margin-left: 5px;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(90deg, #1a2980 0%, #26d0ce 100%);
        }

        button:hover {
            opacity: 0.95;
        }

        .footer-note {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>پرسشنامه نگرش (PKRQ)</h2>
    <p class="subtitle">
        لطفاً میزان موافقت خود را با هر یک از گزاره‌های زیر مشخص کنید.
        <br>
        (۱ = کاملاً مخالفم … ۵ = کاملاً موافقم)
    </p>

    <form method="POST" action="{{ url_for('attitude', mode=mode) }}">

        {% for item in items %}
        <div class="item">
            <div class="item-text">
                {{ loop.index }}. {{ item.text }}
            </div>

            <div class="scale">
                {% for v in [1,2,3,4,5] %}
                <label>
                    <input type="radio"
                           name="item_{{ item.id }}"
                           value="{{ v }}"
                           required>
                    {{ v }}
                </label>
                {% endfor %}
            </div>
        </div>
        {% endfor %}

        <button type="submit">
            ثبت و ادامه به آزمون
        </button>

        <div class="footer-note">
            پاسخ‌های شما صرفاً برای اهداف پژوهشی استفاده می‌شود.
        </div>

    </form>
</div>

</body>
</html>
