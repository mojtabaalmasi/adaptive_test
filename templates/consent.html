<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>رضایت آگاهانه</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn-font@latest/dist/font-face.css" rel="stylesheet">
  <style>
    body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f5f6fa;margin:0}
    .wrap{max-width:820px;margin:40px auto;padding:0 16px}
    .card{background:#fff;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.08);padding:22px}
    h1{margin:0 0 10px;color:#004080;font-size:20px}
    p,li{line-height:1.9;color:#333;font-size:14px}
    .actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
    .btn{background:#0d6efd;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
    .btn-outline{background:#fff;color:#0d6efd;border:1px solid #0d6efd}
    .chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>فرم رضایت آگاهانه</h1>
      <p>مشارکت شما داوطلبانه است و اطلاعات صرفاً برای اهداف پژوهشی استفاده می‌شود.</p>
      <ul>
        <li>می‌توانید در هر زمان از ادامه آزمون منصرف شوید.</li>
        <li>اطلاعات هویتی محرمانه می‌ماند و در گزارش‌ها به‌صورت تجمیعی ارائه می‌شود.</li>
      </ul>

      <form method="post">
        <input type="hidden" name="consent_version" value="v1">
        <label class="chk">
          <input type="checkbox" name="consented" value="1" required>
          <span>مطالب بالا را خواندم و با شرکت در پژوهش موافقم.</span>
        </label>

        <div class="actions">
          <button class="btn" type="submit">ادامه به ثبت‌نام</button>
          <a class="btn btn-outline" href="{{ url_for('index') }}">بازگشت</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
