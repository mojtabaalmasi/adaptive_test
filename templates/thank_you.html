<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سپاس از شما</title>

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Vazirmatn','Vazir',Tahoma,sans-serif;
    }

    body{
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color:#333;
      min-height:100vh;
      padding:20px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width:100%;
      max-width: 820px;
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 15px 50px rgba(0,0,0,0.2);
      animation: fadeIn .8s ease;
      text-align:center;
    }

    .header{
      background: linear-gradient(90deg, #1a2980 0%, #26d0ce 100%);
      color:#fff;
      padding:26px 28px;
      position:relative;
      overflow:hidden;
    }
    .header::before{
      content:"";
      position:absolute;
      top:-50%;
      left:-50%;
      width:200%;
      height:200%;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 70%);
      transform: rotate(30deg);
    }

    .header h1{
      position:relative;
      z-index:2;
      font-size:1.85rem;
      margin:0;
      text-shadow:0 2px 4px rgba(0,0,0,0.2);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .content{
      padding:26px 28px;
      background:#fff;
    }

    .note{
      background:#f0f7ff;
      border-radius:15px;
      padding:14px 14px;
      border-left:4px solid #3498db;
      color:#23395d;
      display:flex;
      gap:10px;
      align-items:flex-start;
      line-height:1.9;
      text-align:right;
      margin-bottom:16px;
    }
    .note i{ color:#3498db; margin-top:2px; }

    p{
      margin:0 0 10px;
      line-height:1.9;
      color:#2c3e50;
      font-size:1rem;
    }

    .muted{
      color:#7f8c8d;
      font-size:0.95rem;
      line-height:1.9;
      margin-top:6px;
    }

    .actions{
      margin-top:18px;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn{
      flex: 1 0 220px;
      max-width: 320px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-decoration:none;
      border:none;
      border-radius:12px;
      padding:14px 16px;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition: all .3s ease;
    }

    .btn-primary{
      background: linear-gradient(90deg, #1a2980 0%, #26d0ce 100%);
      color:#fff;
      box-shadow:0 4px 15px rgba(26,41,128,0.2);
    }
    .btn-primary:hover{
      transform: translateY(-3px);
      box-shadow:0 7px 20px rgba(26,41,128,0.3);
    }

    .btn-outline{
      background:#fff;
      color:#1a2980;
      border:2px solid #e0e6ed;
    }
    .btn-outline:hover{
      transform: translateY(-2px);
      box-shadow:0 6px 16px rgba(0,0,0,0.08);
      border-color:#cfe2ff;
    }

    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(20px); }
      to{ opacity:1; transform: translateY(0); }
    }

    @media (max-width: 768px){
      body{ padding:10px; }
      .container{ border-radius:15px; }
      .header{ padding:20px; }
      .header h1{ font-size:1.45rem; }
      .content{ padding:20px; }
      .btn{ flex: 1 0 100%; max-width: 100%; }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h1><i class="fas fa-circle-check"></i> سپاس از همراهی شما، {{ user_name }}</h1>
    </div>

    <div class="content">
      <div class="note">
        <i class="fas fa-circle-info"></i>
        <div>پاسخ‌های شما در «پرسشنامهٔ راهبردهای آزمون» با موفقیت ثبت شد.</div>
      </div>

      <p class="muted">
        همین‌جا آزمون به پایان می‌رسد. می‌توانید این صفحه را ببندید یا از گزینه‌های زیر استفاده کنید.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="{{ url_for('index') }}">
          <i class="fas fa-house"></i>
          بازگشت به آغاز
        </a>
        <a class="btn btn-outline" href="{{ url_for('result') }}">
          <i class="fas fa-chart-line"></i>
          مشاهدهٔ نتایج آزمون
        </a>
      </div>
    </div>

  </div>
</body>
</html>
